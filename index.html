<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Satsangs in Chennai</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Hind+Madurai:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ECEAE3; --surface:#F8F7F2; --ink:#2A2421; --muted:#6B625B;
  --line:#D6D1C6; --kumkum:#A3262A; --turmeric:#C98F12; --sandal:#E7D8BC;
  --kumkum-soft:#F3DEDC; --turmeric-soft:#F5E9C9;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1C1917; --surface:#26211E; --ink:#EDE6DA; --muted:#A99E92;
    --line:#3B3430; --kumkum:#E0676A; --turmeric:#E3B24A; --sandal:#4A3F31;
    --kumkum-soft:#3A2324; --turmeric-soft:#3A3020;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1C1917; --surface:#26211E; --ink:#EDE6DA; --muted:#A99E92;
  --line:#3B3430; --kumkum:#E0676A; --turmeric:#E3B24A; --sandal:#4A3F31;
  --kumkum-soft:#3A2324; --turmeric-soft:#3A3020;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Hind Madurai","Noto Sans Tamil","Segoe UI",system-ui,sans-serif;
  font-size:1.0625rem; line-height:1.55;
}
.wrap{max-width:46rem; margin:0 auto; padding:2.5rem 1.25rem 4rem}
header h1{
  font-family:Marcellus,"Times New Roman",serif; font-weight:400;
  font-size:clamp(2rem,6vw,3rem); line-height:1.1; margin:0 0 .5rem;
}
header p{margin:0; color:var(--muted); max-width:38rem}

.range{display:flex; flex-wrap:wrap; gap:.75rem 1rem; align-items:end; margin-top:1.75rem}
.range label{display:flex; flex-direction:column; font-size:.9rem; color:var(--muted); gap:.25rem}
.range input[type="date"]{
  font:inherit; color:var(--ink); background:var(--surface);
  border:1px solid var(--line); border-radius:.35rem; padding:.3rem .6rem;
}
.seg{display:inline-flex; border:1px solid var(--ink); border-radius:.4rem; overflow:hidden}
.seg button{
  appearance:none; font:inherit; font-size:.95rem; cursor:pointer;
  border:0; border-right:1px solid var(--line); background:var(--surface); color:var(--ink);
  padding:.35rem .85rem;
}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink); color:var(--bg)}
.nav{display:inline-flex; gap:.4rem}
.nav button{
  appearance:none; font:inherit; cursor:pointer; background:var(--surface); color:var(--ink);
  border:1px solid var(--line); border-radius:.35rem; padding:.35rem .7rem;
}

/* Day strip: the one bold element */
.stripwrap{margin:1.25rem 0 1rem; border:1.5px solid var(--ink); border-radius:.4rem; background:var(--surface); overflow-x:auto}
.strip{display:grid; grid-auto-flow:column; grid-auto-columns:minmax(3.4rem,1fr)}
.day{
  appearance:none; border:0; border-right:1px solid var(--line);
  background:transparent; color:var(--ink); font:inherit; cursor:pointer;
  padding:.5rem .2rem .8rem; text-align:center; min-width:3.4rem;
}
.day:last-child{border-right:0}
.day .mon{display:block; font-size:.72rem; height:1.1rem; color:var(--kumkum); font-weight:600}
.day .dow{display:block; font-size:.8rem; color:var(--muted)}
.day .num{display:block; font-family:Marcellus,serif; font-size:1.6rem; line-height:1.1}
.day .dots{display:flex; gap:4px; justify-content:center; height:8px; margin-top:.35rem}
.day .dots i{width:7px; height:7px; border-radius:50%; background:var(--kumkum)}
.day.sun .dow{color:var(--kumkum)}
.day.monthstart{border-left:2px solid var(--ink)}
.day[aria-pressed="true"]{background:var(--ink); color:var(--bg)}
.day[aria-pressed="true"] .dow,.day[aria-pressed="true"] .mon{color:var(--bg); opacity:.8}
.day[aria-pressed="true"] .dots i{background:var(--turmeric)}
button:focus-visible,input:focus-visible,.link:focus-visible{outline:3px solid var(--turmeric); outline-offset:2px}

.controls{display:flex; flex-wrap:wrap; gap:.5rem; align-items:center; margin-bottom:1.75rem}
.chip{
  appearance:none; font:inherit; font-size:.95rem; cursor:pointer;
  border:1px solid var(--line); background:var(--surface); color:var(--ink);
  padding:.3rem .85rem; border-radius:999px;
}
.chip[aria-pressed="true"]{border-color:var(--ink); background:var(--sandal)}
.theme{margin-left:auto}

h2{font-family:Marcellus,serif; font-weight:400; font-size:1.5rem; margin:2.25rem 0 .25rem}
.sub{color:var(--muted); margin:0 0 1rem; font-size:.95rem}

.list{list-style:none; margin:0; padding:0}
.item{
  background:var(--surface); border-left:4px solid var(--kumkum);
  padding:1.1rem 1.25rem; margin-bottom:.9rem; border-radius:0 .4rem .4rem 0;
}
.item.recurring{border-left-color:var(--turmeric)}
.item h3{margin:0; font-size:1.15rem; font-weight:600; line-height:1.35}
.item .ta{display:block; font-weight:500; color:var(--muted); font-size:1rem}
.who{margin:.15rem 0 .7rem; color:var(--muted)}
dl{display:grid; grid-template-columns:max-content 1fr; gap:.25rem 1rem; margin:0 0 .7rem}
dt{color:var(--muted)}
dd{margin:0}
.status{display:inline-block; font-size:.85rem; padding:.1rem .6rem; border-radius:.3rem; margin-right:.5rem}
.status.ok{background:var(--kumkum-soft); color:var(--kumkum)}
.status.check{background:var(--turmeric-soft); color:var(--ink)}
.note{font-size:.95rem; margin:.4rem 0 0}
.link{color:var(--kumkum); font-weight:500}
.empty{padding:1.25rem; border:1px dashed var(--line); border-radius:.4rem; color:var(--muted)}
footer{margin-top:3rem; font-size:.9rem; color:var(--muted)}
@media (max-width:540px){ dl{grid-template-columns:1fr} dt{margin-top:.3rem} }
@media (prefers-reduced-motion:no-preference){
  .item{animation:in .25s ease-out}
  @keyframes in{from{opacity:0}to{opacity:1}}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Satsangs in Chennai</h1>
    <p id="rangeText"></p>
  </header>

  <div class="range" role="group" aria-label="Choose dates">
    <label>Starting from
      <input type="date" id="start">
    </label>
    <div class="seg" id="span" role="group" aria-label="How many days">
      <button data-days="10">10 days</button>
      <button data-days="14">2 weeks</button>
      <button data-days="30">1 month</button>
      <button data-days="60">2 months</button>
    </div>
    <div class="nav">
      <button id="prev" aria-label="Earlier period">Earlier</button>
      <button id="today">Today</button>
      <button id="next" aria-label="Later period">Later</button>
    </div>
  </div>

  <div class="stripwrap"><div class="strip" id="strip" role="group" aria-label="Choose a day"></div></div>

  <div class="controls" role="group" aria-label="Filter listings">
    <button class="chip" data-filter="all" aria-pressed="true">All listings</button>
    <button class="chip" data-filter="confirmed" aria-pressed="false">Confirmed dates</button>
    <button class="chip" data-filter="recurring" aria-pressed="false">Regular gatherings</button>
    <button class="chip theme" id="theme" aria-label="Switch colour theme">Dark mode</button>
  </div>

  <section id="dated">
    <h2 id="datedTitle">In this period</h2>
    <p class="sub" id="datedSub"></p>
    <ul class="list" id="datedList"></ul>
  </section>

  <section id="regular">
    <h2>Regular gatherings</h2>
    <p class="sub">These groups meet regularly, but no dated Chennai listing was found. Call the centre to confirm the day and time.</p>
    <ul class="list" id="regularList"></ul>
  </section>

  <footer>
    Listings last checked 21 October 2026. Schedules change, so confirm with the organiser before you go.
  </footer>
</div>

<script>
/* ---------- Listings data ----------
   Loaded from listings.json. Dated events: give explicit ISO dates in `dates`,
   or a `rule` that generates dates (currently: "firstSunday" of every month). */
let dated = [];
let regular = [];

/* ---------- Date helpers (local time, no timezone drift) ---------- */
const pad = n => String(n).padStart(2,"0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const longDate = d => d.toLocaleDateString("en-IN",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
const shortDate = d => d.toLocaleDateString("en-IN",{day:"numeric",month:"short"});

function datesFor(e, from, to){
  let list = [];
  if (e.dates) list = e.dates.map(parse);
  if (e.rule === "firstSunday"){
    let m = new Date(from.getFullYear(), from.getMonth(), 1);
    while (m <= to){
      const d = new Date(m); while (d.getDay() !== 0) d.setDate(d.getDate()+1);
      list.push(d);
      m = new Date(m.getFullYear(), m.getMonth()+1, 1);
    }
  }
  return list.filter(d => d >= from && d <= to);
}

/* ---------- State ---------- */
const DEFAULT_START = new Date(2026,9,21);
let start = (() => { const t = new Date(); t.setHours(0,0,0,0); return t < DEFAULT_START ? DEFAULT_START : t; })();
let span = 10;
let selected = null;   // ISO string of picked day
let filter = "all";

try {
  const saved = JSON.parse(localStorage.getItem("satsang-range") || "null");
  if (saved && [10,14,30,60].includes(saved.span)) span = saved.span;
} catch(e){}

function save(){ try { localStorage.setItem("satsang-range", JSON.stringify({span})); } catch(e){} }

/* ---------- Rendering ---------- */
function render(){
  const end = addDays(start, span-1);
  document.getElementById("start").value = iso(start);
  document.getElementById("rangeText").textContent =
    `${longDate(start)} to ${longDate(end)}. Tap a day to see what’s on, or change the dates above.`;
  document.querySelectorAll("#span button").forEach(b =>
    b.setAttribute("aria-pressed", Number(b.dataset.days) === span ? "true" : "false"));

  // occurrences in range
  const occ = [];
  dated.forEach(e => datesFor(e, start, end).forEach(d => occ.push({e, d, key:iso(d)})));
  occ.sort((a,b) => a.d - b.d || a.e.time.localeCompare(b.e.time));

  // strip
  const strip = document.getElementById("strip");
  strip.innerHTML = "";
  for (let i=0; i<span; i++){
    const d = addDays(start,i), key = iso(d);
    const count = occ.filter(o => o.key === key).length;
    const b = document.createElement("button");
    const firstOfMonth = d.getDate() === 1 && i > 0;
    b.className = "day" + (d.getDay()===0 ? " sun" : "") + (firstOfMonth ? " monthstart" : "");
    b.setAttribute("aria-pressed", selected === key ? "true" : "false");
    b.setAttribute("aria-label", `${longDate(d)}, ${count} satsang${count===1?"":"s"}`);
    const mon = (i===0 || d.getDate()===1) ? d.toLocaleDateString("en-IN",{month:"short"}) : "";
    b.innerHTML = `<span class="mon">${mon}</span><span class="dow">${d.toLocaleDateString("en-IN",{weekday:"short"})}</span><span class="num">${d.getDate()}</span><span class="dots">${"<i></i>".repeat(Math.min(count,4))}</span>`;
    b.onclick = () => { selected = selected === key ? null : key; render(); };
    strip.appendChild(b);
  }

  // sections
  document.getElementById("dated").hidden = filter === "recurring";
  document.getElementById("regular").hidden = filter === "confirmed" || selected !== null;

  const title = document.getElementById("datedTitle");
  const sub = document.getElementById("datedSub");
  let html = "";
  if (selected){
    const list = occ.filter(o => o.key === selected);
    title.textContent = longDate(parse(selected));
    sub.textContent = "Tap the day again to see the whole period.";
    html = list.length ? list.map(o => itemHTML(o.e, [o.d])).join("")
      : `<li class="empty">No dated satsang found for this day. Try a regular gathering, or call your nearest centre.</li>`;
  } else {
    title.textContent = "In this period";
    sub.textContent = "Satsangs with confirmed dates in Chennai, grouped by series.";
    const byEvent = new Map();
    occ.forEach(o => { if (!byEvent.has(o.e)) byEvent.set(o.e, []); byEvent.get(o.e).push(o.d); });
    html = byEvent.size ? [...byEvent].map(([e,ds]) => itemHTML(e, ds)).join("")
      : `<li class="empty">No dated satsangs found in this period. Try a longer range, or see the regular gatherings below.</li>`;
  }
  document.getElementById("datedList").innerHTML = html;
  document.getElementById("regularList").innerHTML = regular.map(regularHTML).join("");
}

function whenText(ds, time){
  if (ds.length === 1) return `${longDate(ds[0])}, ${time}`;
  const consecutive = ds.every((d,i) => i===0 || (d - ds[i-1]) === 864e5);
  const dayList = consecutive ? `${shortDate(ds[0])} to ${shortDate(ds[ds.length-1])}` : ds.map(shortDate).join(", ");
  return `${dayList}, ${time}`;
}

function rows(pairs){ return pairs.filter(p => p[1]).map(([k,v]) => `<dt>${k}</dt><dd>${v}</dd>`).join(""); }

function itemHTML(e, ds){
  return `<li class="item">
    <h3>${e.title}${e.ta ? `<span class="ta">${e.ta}</span>` : ""}</h3>
    <p class="who">${e.who}</p>
    <dl>${rows([["When", whenText(ds, e.time)],["Where",e.where],["Language",e.lang],["Entry",e.entry]])}</dl>
    <span class="status ok">Confirmed</span>${e.url ? `<a class="link" href="${e.url}" target="_blank" rel="noopener">${e.urlText}</a>` : ""}
    ${e.note ? `<p class="note">${e.note}</p>` : ""}
  </li>`;
}

function regularHTML(e){
  return `<li class="item recurring">
    <h3>${e.title}</h3>
    <p class="who">${e.who}</p>
    <dl>${rows([["When",e.when],["Where",e.where],["Entry",e.entry]])}</dl>
    <span class="status check">Confirm timing</span>${e.url ? `<a class="link" href="${e.url}" target="_blank" rel="noopener">${e.urlText}</a>` : ""}
    ${e.note ? `<p class="note">${e.note}</p>` : ""}
  </li>`;
}

/* ---------- Controls ---------- */
document.getElementById("start").addEventListener("change", ev => {
  if (!ev.target.value) return;
  start = parse(ev.target.value); selected = null; render();
});
document.querySelectorAll("#span button").forEach(b => b.onclick = () => {
  span = Number(b.dataset.days); selected = null; save(); render();
});
document.getElementById("prev").onclick = () => { start = addDays(start,-span); selected = null; render(); };
document.getElementById("next").onclick = () => { start = addDays(start, span); selected = null; render(); };
document.getElementById("today").onclick = () => { const t = new Date(); t.setHours(0,0,0,0); start = t; selected = null; render(); };

document.querySelectorAll(".chip[data-filter]").forEach(c => c.onclick = () => {
  filter = c.dataset.filter;
  if (filter === "recurring") selected = null;
  document.querySelectorAll(".chip[data-filter]").forEach(x => x.setAttribute("aria-pressed", x===c ? "true" : "false"));
  render();
});

const themeBtn = document.getElementById("theme");
const isDark = () => { const t = document.documentElement.dataset.theme; return t ? t==="dark" : matchMedia("(prefers-color-scheme: dark)").matches; };
const syncTheme = () => themeBtn.textContent = isDark() ? "Light mode" : "Dark mode";
try { const t = localStorage.getItem("satsang-theme"); if (t) document.documentElement.dataset.theme = t; } catch(e){}
themeBtn.onclick = () => {
  const next = isDark() ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem("satsang-theme", next); } catch(e){}
  syncTheme();
};
syncTheme();
fetch("listings.json", {cache:"no-cache"})
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(d => { dated = d.dated || []; regular = d.regular || []; render(); })
  .catch(() => {
    render();
    document.getElementById("datedList").innerHTML =
      `<li class="empty">Couldn’t load listings. Refresh the page to try again.</li>`;
  });
</script>
</body>
</html>
